packages:
  - "examples/vue"
  - "examples/react"
  - "examples/react-apollo"
  - "examples/vanilla"
  - "examples/node-server"
  - "test/fixtures/*"

# Dependencies allowed to run install scripts (pnpm 10+ skips them otherwise)
allowBuilds:
  esbuild: true
  playwright-chromium: true
  yorkie: true
